name: Check and Update xray-core

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout our repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch latest release tag from external repository
        id: fetch-release
        run: |
          EXTERNAL_REPO="XTLS/Xray-core"
          LATEST_TAG=$(curl -s https://api.github.com/repos/$EXTERNAL_REPO/tags | jq -r '.[0]')
          LATEST_TAG_NAME=$(echo $LATEST_TAG | jq -r .name)
          LATEST_TAG_SHA=$(echo $LATEST_TAG | jq -r .commit.sha)
          echo "Latest tag from external repo: $LATEST_TAG_NAME"
          echo "LATEST_TAG_NAME=$LATEST_TAG_NAME" >> $GITHUB_ENV
          echo "LATEST_TAG_SHA=$LATEST_TAG_SHA" >> $GITHUB_ENV

      - name: Fetch current repository release tag
        id: fetch-current-tag
        run: |
          CURRENT_TAG_NAME=$(git describe --tags --abbrev=0 2>/dev/null || true)
          echo "Current tag in this repo: ${CURRENT_TAG_NAME:-<none>}"
          echo "CURRENT_TAG_NAME=$CURRENT_TAG_NAME" >> $GITHUB_ENV

      - name: Compare tags
        id: compare-tags
        run: |
          echo "needs_update=false" >> $GITHUB_ENV
          echo "need_release=false" >> $GITHUB_ENV

          RELEASE_HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${LATEST_TAG_NAME}")
          echo "GitHub Release ${LATEST_TAG_NAME}: HTTP $RELEASE_HTTP"

          if [ -z "$CURRENT_TAG_NAME" ]; then
            echo "本仓库还没有 git tag，将按上游 $LATEST_TAG_NAME 更新并发版"
            echo "needs_update=true" >> $GITHUB_ENV
            echo "need_release=true" >> $GITHUB_ENV
          elif [ "$LATEST_TAG_NAME" != "$CURRENT_TAG_NAME" ]; then
            if [ "$(printf '%s\n' "$LATEST_TAG_NAME" "$CURRENT_TAG_NAME" | sort -V | tail -n1)" == "$CURRENT_TAG_NAME" ]; then
              echo "上游 tag 不比当前新，跳过依赖更新"
            else
              echo "Xray-core 有新 tag，更新 go.mod"
              echo "needs_update=true" >> $GITHUB_ENV
              echo "need_release=true" >> $GITHUB_ENV
            fi
          else
            echo "git tag 已与上游相同: $CURRENT_TAG_NAME"
          fi

          if [ "$RELEASE_HTTP" != "200" ]; then
            echo "还没有 GitHub Release $LATEST_TAG_NAME，将触发 Build 发版"
            echo "need_release=true" >> $GITHUB_ENV
          fi

      - name: Setup Golang
        if: env.needs_update == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Update and commit changes
        if: env.needs_update == 'true'
        run: |
          # Sync Go version from upstream go.mod
          EXTERNAL_REPO="XTLS/Xray-core"
          GO_VERSION=$(curl -s https://raw.githubusercontent.com/$EXTERNAL_REPO/${{ env.LATEST_TAG_NAME }}/go.mod | awk '/^go / {print $2; exit}')
          if [ -n "$GO_VERSION" ]; then
            echo "Syncing Go version to $GO_VERSION"
            go mod edit -go=$GO_VERSION
          else
            echo "Failed to detect Go version from upstream go.mod"
          fi

          go get github.com/xtls/xray-core@${{ env.LATEST_TAG_SHA }}
          go get golang.org/x/mobile@latest
          
          # Clean up and verify module dependencies
          go mod tidy -v
          
          # Show changes
          git diff

      - name: Commit and push changes
        id: auto-commit-action
        if: env.needs_update == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Updating xray-core to ${{ env.LATEST_TAG_NAME }} ${{ env.LATEST_TAG_SHA }}
          tagging_message: ${{ env.LATEST_TAG_NAME }}

      - name: Trigger build
        if: env.need_release == 'true'
        env:
          GH_PAT: ${{ secrets.ANDROIDLIBXRAYLITE }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "缺少仓库 Secret ANDROIDLIBXRAYLITE，无法触发 main.yml 发版。GITHUB_TOKEN 不会启动下一个 workflow。"
            exit 1
          fi
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $GH_PAT" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/main.yml/dispatches \
            -d "{
              \"ref\": \"main\",
              \"inputs\": {
                \"release_tag\": \"${{ env.LATEST_TAG_NAME }}\"
              }
            }"
